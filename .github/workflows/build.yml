name: Build

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: Ad-Astra-EMI-Compat-1.20.1-Forge
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1
