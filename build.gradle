plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            mods {
                adastraemicompat {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = 'TeamResourceful'
        url = 'https://maven.teamresourceful.com/repository/maven-public/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")
    compileOnly fg.deobf("maven.modrinth:3ufwT9JF:8EwzHQkx")
    compileOnly fg.deobf("earth.terrarium.botarium:botarium-forge-1.20.1:2.3.3")
    compileOnly fg.deobf("com.teamresourceful.resourcefullib:resourcefullib-forge-1.20.1:2.1.23")
    compileOnly fg.deobf("com.teamresourceful.resourcefulconfig:resourcefulconfig-forge-1.20.1:2.1.2")

    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}")
    runtimeOnly fg.deobf("maven.modrinth:3ufwT9JF:8EwzHQkx")
    runtimeOnly fg.deobf("earth.terrarium.botarium:botarium-forge-1.20.1:2.3.3")
    runtimeOnly fg.deobf("com.teamresourceful.resourcefullib:resourcefullib-forge-1.20.1:2.1.23")
    runtimeOnly fg.deobf("com.teamresourceful.resourcefulconfig:resourcefulconfig-forge-1.20.1:2.1.2")
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        minecraft_version_range: minecraft_version_range,
        forge_version: forge_version,
        ad_astra_version: ad_astra_version
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
